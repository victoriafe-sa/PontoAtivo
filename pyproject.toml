[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pontoativo-rag"
version = "0.1.0"
description = "Protótipo acadêmico de RAG para espaços esportivos do Distrito Federal"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.0",
  "beautifulsoup4>=4.12,<5",
  "chromadb>=1.0,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "sentence-transformers>=3.3,<6",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pontoativo-diagnostico = "pontoativo_rag.diagnostico:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "teste_*.py"]
markers = [
  "integration: testes que usam modelos ou serviços externos",
]

