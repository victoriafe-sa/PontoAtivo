<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 860" width="1460" height="860" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>PontoAtivo — arquitetura do sistema multiagentes (fluxo documental, 5 agentes)</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#172649"/></marker>
    <marker id="seta-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="seta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1460" height="860" fill="#ffffff"/>

  <text x="30" y="48" font-size="27" font-weight="800" fill="#172649">PontoAtivo — arquitetura do sistema multiagentes</text>
  <text x="30" y="76" font-size="15.5" fill="#475569">Fluxo documental com cinco agentes especializados, encadeados pelo coordenador; as mensagens são estruturas definidas em contratos.py.</text>

  <!-- Recursos -->
  <rect x="485" y="98" width="180" height="58" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="575" y="122" font-size="14" font-weight="800" fill="#0c4a6e" text-anchor="middle">Índice Chroma + E5</text>
  <text x="575" y="142" font-size="12.5" fill="#0c4a6e" text-anchor="middle">25 fontes · limiar 0,12</text>

  <rect x="745" y="98" width="260" height="58" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="875" y="122" font-size="14" font-weight="800" fill="#0c4a6e" text-anchor="middle">Gemma 4 12B (Ollama)</text>
  <text x="875" y="142" font-size="12.5" fill="#0c4a6e" text-anchor="middle">Análise e revisão da Validação</text>

  <!-- Coordenador -->
  <rect x="160" y="186" width="1130" height="384" rx="20" fill="#f8fafc" stroke="#172649" stroke-width="2"/>
  <text x="180" y="211" font-size="14" font-weight="800" fill="#172649">Coordenador · FluxoDocumental</text>
  <text x="180" y="229" font-size="12" fill="#475569">limita tentativas e tempo</text>

  <line x1="575" y1="158" x2="575" y2="230" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>
  <line x1="815" y1="158" x2="775" y2="230" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>
  <line x1="935" y1="158" x2="975" y2="230" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>

  <!-- Usuário -->
  <rect x="20" y="248" width="122" height="90" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="81" y="284" font-size="16" font-weight="700" fill="#172649" text-anchor="middle">Usuário</text>
  <text x="81" y="306" font-size="12.5" fill="#475569" text-anchor="middle">pergunta no</text>
  <text x="81" y="322" font-size="12.5" fill="#475569" text-anchor="middle">site ou terminal</text>
  <line x1="143" y1="293" x2="171" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Verificação -->
  <rect x="175" y="242" width="112" height="102" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="231" y="280" font-size="14" font-weight="800" fill="#172649" text-anchor="middle">Verificação</text>
  <text x="231" y="301" font-size="12" fill="#334155" text-anchor="middle">pergunta vazia</text>
  <text x="231" y="317" font-size="12" fill="#334155" text-anchor="middle">ou imprópria</text>
  <line x1="288" y1="293" x2="301" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Agentes -->
  <g>
    <rect x="305" y="234" width="160" height="118" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
    <text x="385" y="257" font-size="12" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 1</text>
    <text x="385" y="279" font-size="16.5" font-weight="800" fill="#172649" text-anchor="middle">Interpretação</text>
    <text x="385" y="301" font-size="12" fill="#334155" text-anchor="middle">regras: classifica a</text>
    <text x="385" y="317" font-size="12" fill="#334155" text-anchor="middle">intenção e preserva</text>
    <text x="385" y="333" font-size="12" fill="#334155" text-anchor="middle">a pergunta</text>
  </g>
  <line x1="466" y1="293" x2="481" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>
  <g>
    <rect x="485" y="234" width="180" height="118" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
    <text x="575" y="257" font-size="12" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 2</text>
    <text x="575" y="279" font-size="16.5" font-weight="800" fill="#172649" text-anchor="middle">Pesquisa</text>
    <text x="575" y="301" font-size="12" fill="#334155" text-anchor="middle">busca híbrida e entrega só</text>
    <text x="575" y="317" font-size="12" fill="#334155" text-anchor="middle">os trechos que passam</text>
    <text x="575" y="333" font-size="12" fill="#334155" text-anchor="middle">na regra de evidência</text>
  </g>
  <line x1="666" y1="293" x2="681" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>
  <g>
    <rect x="685" y="234" width="180" height="118" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
    <text x="775" y="257" font-size="12" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 3</text>
    <text x="775" y="279" font-size="16.5" font-weight="800" fill="#172649" text-anchor="middle">Análise</text>
    <text x="775" y="301" font-size="12" fill="#334155" text-anchor="middle">rascunho com passagens</text>
    <text x="775" y="317" font-size="12" fill="#334155" text-anchor="middle">literais: sustentada,</text>
    <text x="775" y="333" font-size="12" fill="#334155" text-anchor="middle">lacuna ou divergência</text>
  </g>
  <line x1="866" y1="293" x2="881" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>
  <g>
    <rect x="885" y="234" width="180" height="118" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
    <text x="975" y="257" font-size="12" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 4</text>
    <text x="975" y="279" font-size="16.5" font-weight="800" fill="#172649" text-anchor="middle">Validação</text>
    <text x="975" y="301" font-size="12" fill="#334155" text-anchor="middle">confere apoio, sentido,</text>
    <text x="975" y="317" font-size="12" fill="#334155" text-anchor="middle">condições, datas e</text>
    <text x="975" y="333" font-size="12" fill="#334155" text-anchor="middle">lacunas (regras + LLM)</text>
  </g>
  <line x1="1066" y1="293" x2="1081" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>
  <g>
    <rect x="1085" y="234" width="185" height="118" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
    <text x="1177" y="257" font-size="12" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 5</text>
    <text x="1177" y="279" font-size="16.5" font-weight="800" fill="#172649" text-anchor="middle">Comunicação</text>
    <text x="1177" y="301" font-size="12" fill="#334155" text-anchor="middle">monta a resposta com</text>
    <text x="1177" y="317" font-size="12" fill="#334155" text-anchor="middle">fontes F1…Fn e próximos</text>
    <text x="1177" y="333" font-size="12" fill="#334155" text-anchor="middle">passos (sem LLM)</text>
  </g>

  <!-- Resposta -->
  <rect x="1310" y="248" width="130" height="90" rx="14" fill="#172649"/>
  <text x="1375" y="286" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Resposta</text>
  <text x="1375" y="307" font-size="12" fill="#dbe4f3" text-anchor="middle">com fontes</text>
  <text x="1375" y="323" font-size="12" fill="#dbe4f3" text-anchor="middle">ao usuário</text>
  <line x1="1271" y1="293" x2="1306" y2="293" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Mensagens -->
  <g font-size="11.5" fill="#172649">
    <rect x="305" y="366" width="160" height="86" rx="10" fill="#eef2ff"/>
    <text x="315" y="385" font-weight="700">→ AcaoPesquisa</text>
    <text x="315" y="403">consulta,</text>
    <text x="315" y="419">pergunta_original, tipo</text>

    <rect x="485" y="366" width="180" height="86" rx="10" fill="#eef2ff"/>
    <text x="495" y="385" font-weight="700">→ ResultadoPesquisa</text>
    <text x="495" y="403">status, trechos T1…Tn,</text>
    <text x="495" y="419">fonte (DOC, página, URL),</text>
    <text x="495" y="435">distância e descartes</text>

    <rect x="885" y="366" width="180" height="86" rx="10" fill="#eef2ff"/>
    <text x="895" y="385" font-weight="700">→ Parecer</text>
    <text x="895" y="403">aprovado ou não, problemas</text>
    <text x="895" y="419">e consulta complementar,</text>
    <text x="895" y="435">vinculado ao rascunho</text>

    <rect x="1085" y="366" width="185" height="86" rx="10" fill="#eef2ff"/>
    <text x="1095" y="385" font-weight="700">→ Comunicado</text>
    <text x="1095" y="403">texto, fontes F1…Fn</text>
    <text x="1095" y="419">e próximos passos</text>
  </g>
  <rect x="685" y="366" width="180" height="86" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="695" y="385" font-size="11.5" font-weight="700" fill="#9a3412">→ rascunho (ItemAnalise)</text>
  <text x="695" y="403" font-size="11.5" fill="#9a3412">checagem validar_analise:</text>
  <text x="695" y="419" font-size="11.5" fill="#9a3412">campos, IDs e passagens</text>
  <text x="695" y="435" font-size="11.5" fill="#9a3412">literais (até 2 tentativas)</text>

  <!-- Correções da Validação -->
  <path d="M 930 453 L 930 478 L 800 478 L 800 457" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#seta-laranja)"/>
  <text x="865" y="496" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">reprovado: feedback e rascunho (1 correção)</text>
  <path d="M 1045 453 L 1045 526 L 590 526 L 590 457" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#seta-laranja)"/>
  <text x="818" y="545" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">até 1 busca complementar</text>

  <!-- Caminhos sem resposta redigida -->
  <line x1="505" y1="453" x2="505" y2="596" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <text x="497" y="486" font-size="11.5" fill="#64748b" text-anchor="end">sem trechos</text>
  <text x="497" y="501" font-size="11.5" fill="#64748b" text-anchor="end">aceitos</text>
  <rect x="300" y="600" width="330" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="316" y="623" font-size="13" font-weight="800" fill="#172649">Abstenção</text>
  <text x="316" y="643" font-size="12.5" fill="#334155">o LLM não é chamado; a resposta diz que não sabe</text>

  <line x1="1058" y1="453" x2="1058" y2="596" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <text x="1066" y="486" font-size="11.5" fill="#64748b">Análise ou Validação</text>
  <text x="1066" y="501" font-size="11.5" fill="#64748b">sem sucesso</text>
  <rect x="860" y="600" width="410" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="876" y="623" font-size="13" font-weight="800" fill="#172649">Trechos sem resposta redigida</text>
  <text x="876" y="643" font-size="12.5" fill="#334155">reprovação persistente, formato inválido, modelo fora ou prazo</text>

  <path d="M 465 659 L 465 684 L 1375 684 L 1375 342" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <path d="M 1065 659 L 1065 684" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Legenda -->
  <g font-size="13" fill="#334155">
    <line x1="30" y1="736" x2="80" y2="736" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>
    <text x="90" y="741">mensagem entre agentes</text>
    <line x1="290" y1="736" x2="340" y2="736" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#seta-laranja)"/>
    <text x="350" y="741">correção pedida pela Validação</text>
    <line x1="610" y1="736" x2="660" y2="736" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
    <text x="670" y="741">caminho sem resposta redigida</text>
    <line x1="920" y1="736" x2="970" y2="736" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>
    <text x="980" y="741">consulta a recurso</text>
    <rect x="30" y="764" width="34" height="20" rx="6" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2"/>
    <text x="74" y="779">agente especializado</text>
    <rect x="250" y="764" width="34" height="20" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="294" y="779">etapa do coordenador</text>
    <rect x="470" y="764" width="34" height="20" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="514" y="779">checagem dentro do módulo de Análise</text>
  </g>
  <text x="30" y="826" font-size="12" fill="#64748b">Código: src/pontoativo_rag/agentes/ (interpretacao, pesquisa, analise, validacao, comunicacao, coordenador, contratos) · Até 8 chamadas ao LLM, sob um orçamento de tempo compartilhado.</text>
</svg>
