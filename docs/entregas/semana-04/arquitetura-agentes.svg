<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 800" width="1340" height="800" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>PontoAtivo — arquitetura do sistema multiagentes (fluxo documental)</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#172649"/></marker>
    <marker id="seta-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="seta-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1340" height="800" fill="#ffffff"/>

  <text x="40" y="50" font-size="27" font-weight="800" fill="#172649">PontoAtivo — arquitetura do sistema multiagentes</text>
  <text x="40" y="78" font-size="15.5" fill="#475569">Fluxo documental: o coordenador encadeia três agentes especializados; as mensagens são estruturas definidas em contratos.py.</text>

  <!-- Recursos (acima) -->
  <rect x="585" y="102" width="200" height="58" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="685" y="126" font-size="14" font-weight="800" fill="#0c4a6e" text-anchor="middle">Índice Chroma + E5</text>
  <text x="685" y="146" font-size="12.5" fill="#0c4a6e" text-anchor="middle">25 fontes oficiais · limiar 0,12</text>

  <rect x="815" y="102" width="200" height="58" rx="12" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="915" y="126" font-size="14" font-weight="800" fill="#0c4a6e" text-anchor="middle">Gemma 4 12B (Ollama)</text>
  <text x="915" y="146" font-size="12.5" fill="#0c4a6e" text-anchor="middle">saída em JSON com esquema</text>

  <!-- Coordenador (contêiner) -->
  <rect x="190" y="190" width="1000" height="290" rx="20" fill="#f8fafc" stroke="#172649" stroke-width="2"/>
  <text x="212" y="215" font-size="14" font-weight="800" fill="#172649">Coordenador · FluxoDocumental</text>
  <text x="212" y="472" font-size="12.5" fill="#475569">O coordenador encadeia as etapas, limita tentativas e tempo e trata falhas do modelo.</text>
  <line x1="685" y1="162" x2="685" y2="230" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>
  <line x1="915" y1="162" x2="915" y2="230" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>

  <!-- Usuário -->
  <rect x="30" y="246" width="135" height="90" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="97" y="282" font-size="16" font-weight="700" fill="#172649" text-anchor="middle">Usuário</text>
  <text x="97" y="304" font-size="12.5" fill="#475569" text-anchor="middle">pergunta no</text>
  <text x="97" y="320" font-size="12.5" fill="#475569" text-anchor="middle">site ou terminal</text>
  <line x1="166" y1="291" x2="208" y2="291" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Moderação -->
  <rect x="212" y="238" width="140" height="106" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="282" y="276" font-size="15" font-weight="800" fill="#172649" text-anchor="middle">Verificação</text>
  <text x="282" y="298" font-size="12.5" fill="#334155" text-anchor="middle">pergunta vazia ou</text>
  <text x="282" y="315" font-size="12.5" fill="#334155" text-anchor="middle">termo impróprio</text>
  <line x1="353" y1="291" x2="378" y2="291" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Agente 1: Interpretação -->
  <rect x="382" y="234" width="170" height="114" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
  <text x="467" y="258" font-size="12.5" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 1</text>
  <text x="467" y="281" font-size="17" font-weight="800" fill="#172649" text-anchor="middle">Interpretação</text>
  <text x="467" y="303" font-size="12.5" fill="#334155" text-anchor="middle">regras: classifica a</text>
  <text x="467" y="320" font-size="12.5" fill="#334155" text-anchor="middle">intenção e preserva</text>
  <text x="467" y="337" font-size="12.5" fill="#334155" text-anchor="middle">a pergunta</text>
  <line x1="553" y1="291" x2="580" y2="291" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Agente 2: Pesquisa -->
  <rect x="585" y="234" width="200" height="114" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
  <text x="685" y="258" font-size="12.5" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 2</text>
  <text x="685" y="281" font-size="17" font-weight="800" fill="#172649" text-anchor="middle">Pesquisa</text>
  <text x="685" y="303" font-size="12.5" fill="#334155" text-anchor="middle">busca híbrida e só entrega</text>
  <text x="685" y="320" font-size="12.5" fill="#334155" text-anchor="middle">trechos que passam na</text>
  <text x="685" y="337" font-size="12.5" fill="#334155" text-anchor="middle">regra de evidência</text>
  <line x1="786" y1="291" x2="810" y2="291" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Agente 3: Análise -->
  <rect x="815" y="234" width="200" height="114" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2.5"/>
  <text x="915" y="258" font-size="12.5" font-weight="700" fill="#2e8b3d" text-anchor="middle">AGENTE 3</text>
  <text x="915" y="281" font-size="17" font-weight="800" fill="#172649" text-anchor="middle">Análise</text>
  <text x="915" y="303" font-size="12.5" fill="#334155" text-anchor="middle">conclusões com passagens</text>
  <text x="915" y="320" font-size="12.5" fill="#334155" text-anchor="middle">literais; sustentada,</text>
  <text x="915" y="337" font-size="12.5" fill="#334155" text-anchor="middle">lacuna ou divergência</text>
  <line x1="1016" y1="291" x2="1040" y2="291" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Formatação -->
  <rect x="1044" y="238" width="130" height="106" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1109" y="276" font-size="15" font-weight="800" fill="#172649" text-anchor="middle">Formatação</text>
  <text x="1109" y="298" font-size="12.5" fill="#334155" text-anchor="middle">Tn vira</text>
  <text x="1109" y="315" font-size="12.5" fill="#334155" text-anchor="middle">referência Fn</text>

  <!-- Mensagens (contratos) -->
  <g font-size="12" fill="#172649">
    <rect x="382" y="364" width="170" height="96" rx="10" fill="#eef2ff"/>
    <text x="394" y="384" font-weight="700">→ AcaoPesquisa</text>
    <text x="394" y="403">consulta,</text>
    <text x="394" y="420">pergunta_original,</text>
    <text x="394" y="437">tipo</text>

    <rect x="585" y="364" width="200" height="96" rx="10" fill="#eef2ff"/>
    <text x="597" y="384" font-weight="700">→ ResultadoPesquisa</text>
    <text x="597" y="403">status, trechos T1…Tn,</text>
    <text x="597" y="420">fonte (DOC, página, URL),</text>
    <text x="597" y="437">distância e descartes</text>

    <rect x="1044" y="364" width="130" height="96" rx="10" fill="#eef2ff"/>
    <text x="1056" y="384" font-weight="700">→ resposta</text>
    <text x="1056" y="403">conclusões com</text>
    <text x="1056" y="420">referências F1…Fn</text>
  </g>

  <!-- Validação dentro da Análise + nova tentativa -->
  <rect x="815" y="364" width="200" height="96" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="827" y="384" font-size="12.5" font-weight="800" fill="#9a3412">validar_analise</text>
  <text x="827" y="403" font-size="12" fill="#9a3412">confere campos, estados,</text>
  <text x="827" y="420" font-size="12" fill="#9a3412">IDs e se cada passagem</text>
  <text x="827" y="437" font-size="12" fill="#9a3412">existe no trecho</text>
  <path d="M 1015 412 C 1034 412, 1034 330, 1016 330" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#seta-laranja)"/>
  <text x="1176" y="472" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="end">inválida: 1 nova tentativa</text>

  <!-- Usuário recebe -->
  <rect x="1205" y="246" width="115" height="90" rx="14" fill="#172649"/>
  <text x="1262" y="284" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Resposta</text>
  <text x="1262" y="305" font-size="12" fill="#dbe4f3" text-anchor="middle">com fontes</text>
  <text x="1262" y="321" font-size="12" fill="#dbe4f3" text-anchor="middle">ao usuário</text>
  <line x1="1175" y1="291" x2="1201" y2="291" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Caminhos de falha (abaixo) -->
  <line x1="685" y1="461" x2="685" y2="514" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <rect x="520" y="518" width="330" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="536" y="542" font-size="13" font-weight="800" fill="#172649">Sem trechos aceitos → abstenção</text>
  <text x="536" y="562" font-size="12.5" fill="#334155">o LLM não é chamado; a resposta diz que não sabe</text>

  <line x1="915" y1="461" x2="915" y2="514" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <rect x="870" y="518" width="330" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="886" y="542" font-size="13" font-weight="800" fill="#172649">2ª tentativa inválida ou modelo fora</text>
  <text x="886" y="562" font-size="12.5" fill="#334155">mostra os trechos, sem resposta redigida</text>

  <path d="M 685 581 L 685 606 L 1262 606 L 1262 341" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
  <path d="M 1201 549 L 1262 549" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Legenda -->
  <g font-size="13" fill="#334155">
    <line x1="40" y1="672" x2="90" y2="672" stroke="#172649" stroke-width="2" marker-end="url(#seta)"/>
    <text x="100" y="677">mensagem entre etapas</text>
    <line x1="290" y1="672" x2="340" y2="672" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#seta-laranja)"/>
    <text x="350" y="677">correção (no máximo 2 chamadas ao modelo)</text>
    <line x1="650" y1="672" x2="700" y2="672" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta-cinza)"/>
    <text x="710" y="677">caminho sem resposta redigida</text>
    <line x1="950" y1="672" x2="1000" y2="672" stroke="#0369a1" stroke-width="2" marker-end="url(#seta-azul)"/>
    <text x="1010" y="677">consulta a recurso</text>
    <rect x="40" y="700" width="34" height="20" rx="6" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2"/>
    <text x="84" y="715">agente especializado</text>
    <rect x="260" y="700" width="34" height="20" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="304" y="715">etapa do coordenador</text>
    <rect x="480" y="700" width="34" height="20" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="524" y="715">validação dentro do módulo de Análise</text>
  </g>
  <text x="40" y="760" font-size="12" fill="#64748b">Código: src/pontoativo_rag/agentes/ (interpretacao.py, pesquisa.py, analise.py, coordenador.py, contratos.py) · Demonstração: scripts/demonstrar_multiagentes.py</text>
</svg>
