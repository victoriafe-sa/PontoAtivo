<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" font-family="Arial, sans-serif">
<title>PontoAtivo — fluxo documental com quatro agentes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1500" height="850" fill="white"/>

<text x="40" y="48" font-size="30" fill="#172649" font-weight="bold">PontoAtivo — arquitetura do sistema multiagentes</text>
<text x="40" y="80" font-size="19" fill="#475569" font-weight="normal">FluxoDocumental coordena quatro agentes, limita correções e compartilha o orçamento de tempo.</text>
<rect x="40" y="115" width="420" height="92" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="147" font-size="20" fill="#172649" font-weight="bold">Entrada: site ou terminal</text>
<text x="58" y="177" font-size="17" fill="#172649" font-weight="normal">Verificação da pergunta e moderação</text>
<rect x="510" y="115" width="380" height="92" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="528" y="147" font-size="20" fill="#172649" font-weight="bold">Pesquisa: Chroma + embeddings E5</text>
<text x="528" y="177" font-size="17" fill="#172649" font-weight="normal">Fontes oficiais e seleção de evidências</text>
<rect x="940" y="115" width="520" height="92" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="958" y="147" font-size="20" fill="#172649" font-weight="bold">Análise e revisão: Ollama</text>
<text x="958" y="177" font-size="17" fill="#172649" font-weight="normal">Mesmo modelo por padrão; papéis e prompts distintos</text>
<path d="M 240 207 L 240 245" fill="none" stroke="#172649" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M 680 207 L 680 230 L 605 230 L 605 245" fill="none" stroke="#0369a1" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M 1200 207 L 1200 225 L 970 225 L 970 245" fill="none" stroke="#0369a1" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M 1335 207 L 1335 245" fill="none" stroke="#0369a1" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="40" y="250" width="325" height="155" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2"/>
<text x="58" y="282" font-size="20" fill="#172649" font-weight="bold">1 · Interpretação</text>
<text x="58" y="312" font-size="17" fill="#172649" font-weight="normal">Classifica a intenção</text>
<text x="58" y="337" font-size="17" fill="#172649" font-weight="normal">Preserva pergunta e condições</text>
<text x="58" y="362" font-size="17" fill="#172649" font-weight="normal">Saída: AcaoPesquisa</text>
<rect x="405" y="250" width="325" height="155" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2"/>
<text x="423" y="282" font-size="20" fill="#172649" font-weight="bold">2 · Pesquisa</text>
<text x="423" y="312" font-size="17" fill="#172649" font-weight="normal">Recupera e filtra os trechos</text>
<text x="423" y="337" font-size="17" fill="#172649" font-weight="normal">Preserva fonte, URL e metadados</text>
<text x="423" y="362" font-size="17" fill="#172649" font-weight="normal">Saída: ResultadoPesquisa</text>
<rect x="770" y="250" width="325" height="155" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2"/>
<text x="788" y="282" font-size="20" fill="#172649" font-weight="bold">3 · Análise</text>
<text x="788" y="312" font-size="17" fill="#172649" font-weight="normal">Produz conclusões e evidências</text>
<text x="788" y="337" font-size="17" fill="#172649" font-weight="normal">Confere contrato e citações</text>
<text x="788" y="362" font-size="17" fill="#172649" font-weight="normal">Saída: lista de ItemAnalise</text>
<rect x="1135" y="250" width="325" height="155" rx="14" fill="#ecfdf3" stroke="#2e8b3d" stroke-width="2"/>
<text x="1153" y="282" font-size="20" fill="#172649" font-weight="bold">4 · Validação</text>
<text x="1153" y="312" font-size="17" fill="#172649" font-weight="normal">Regras lexicais + revisão por LLM</text>
<text x="1153" y="337" font-size="17" fill="#172649" font-weight="normal">Aponta falhas e pede correção</text>
<text x="1153" y="362" font-size="17" fill="#172649" font-weight="normal">Saída: Parecer</text>
<path d="M 365 325 L 400 325" fill="none" stroke="#172649" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M 730 325 L 765 325" fill="none" stroke="#172649" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M 1095 325 L 1130 325" fill="none" stroke="#172649" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M 1250 405 L 1250 450 L 935 450 L 935 410" fill="none" stroke="#c2410c" stroke-width="2.5"  stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="880" y="476" font-size="17" fill="#9a3412" font-weight="normal">Feedback + rascunho anterior: 1 correção por padrão</text>
<path d="M 1385 405 L 1385 510 L 570 510 L 570 410" fill="none" stroke="#c2410c" stroke-width="2.5"  stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="650" y="535" font-size="17" fill="#9a3412" font-weight="normal">Até 1 busca complementar, se ainda houver correção disponível</text>
<path d="M 1450 405 L 1450 575" fill="none" stroke="#2e8b3d" stroke-width="2.5"  marker-end="url(#arrow)"/>
<text x="1360" y="559" font-size="17" fill="#2e8b3d" font-weight="normal">Aprovada</text>
<rect x="1000" y="580" width="460" height="108" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1018" y="612" font-size="20" fill="#172649" font-weight="bold">Resposta formatada pelo coordenador</text>
<text x="1018" y="642" font-size="17" fill="#172649" font-weight="normal">Conclusões aprovadas e referências F1…Fn</text>
<text x="1018" y="667" font-size="17" fill="#172649" font-weight="normal">IDs únicos após juntar as buscas</text>
<rect x="40" y="580" width="420" height="108" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="612" font-size="20" fill="#172649" font-weight="bold">Sem trechos aceitos: abstenção</text>
<text x="58" y="642" font-size="17" fill="#172649" font-weight="normal">Encerra antes da Análise</text>
<text x="58" y="667" font-size="17" fill="#172649" font-weight="normal">Não chama o modelo</text>
<path d="M 425 405 L 425 575" fill="none" stroke="#64748b" stroke-width="2.5"  stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="510" y="580" width="440" height="108" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="528" y="612" font-size="20" fill="#172649" font-weight="bold">Falha persistente ou prazo esgotado</text>
<text x="528" y="642" font-size="17" fill="#172649" font-weight="normal">Mostra trechos recuperados</text>
<text x="528" y="667" font-size="17" fill="#172649" font-weight="normal">Não publica o rascunho reprovado</text>
<path d="M 800 405 L 800 425 L 760 425 L 760 575" fill="none" stroke="#64748b" stroke-width="2.5"  stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="40" y="738" font-size="20" fill="#172649" font-weight="bold">Limites padrão</text>
<text x="40" y="770" font-size="18" fill="#172649" font-weight="normal">Até 2 tentativas por rascunho + até 2 por parecer; 1 correção do rascunho: até 8 chamadas ao modelo.</text>
<text x="40" y="800" font-size="18" fill="#475569" font-weight="normal">Todas compartilham o prazo. A aprovação do revisor não garante verdade ou completude; requer avaliação semântica.</text>
</svg>