name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (RAG, encontros e curadoria)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # O PyTorch de CPU é bem menor que o padrão com CUDA e basta para os testes.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Testes do RAG, do chat e dos encontros
        run: python -m pytest -q -m "not integration"

      - name: Testes da curadoria
        working-directory: curadoria
        run: python -B -m unittest discover -s ferramentas/tests

  javascript:
    name: JavaScript e dados do mapa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sintaxe dos scripts
        run: |
          node --check site/app.js
          node --check site/encontros.js
          node --check site/data/locais.js
          node --check curadoria/ferramentas/exportar-locais-encontros.mjs

      # A agenda usa um catálogo derivado do mapa; os dois precisam estar em dia.
      - name: Catálogo dos encontros em dia com o mapa
        run: |
          node curadoria/ferramentas/exportar-locais-encontros.mjs
          git diff --exit-code -- site/data/locais-encontros.json || {
            echo "::error::Rode node curadoria/ferramentas/exportar-locais-encontros.mjs e commite o resultado."
            exit 1
          }
